name: Italian stability build and regression
on:
  push:
    branches: [master, 'fix/**']
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 25
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2
      - uses: nuget/setup-nuget@d105a947828025cd7a980103c35ba2bfae586d0f # v2
      - name: Restore and build managed shell extension
        shell: powershell
        run: |
          nuget restore QTTabBar/packages.config -PackagesDirectory packages -Source https://api.nuget.org/v3/index.json -NonInteractive
          if ($LASTEXITCODE) { throw 'NuGet restore failed' }
          msbuild QTTabBar/QTTabBar.csproj /p:Configuration=Release /p:Platform=AnyCPU "/p:SolutionDir=$env:GITHUB_WORKSPACE\" /nologo /v:minimal
          if ($LASTEXITCODE) { throw 'Build failed' }
          msbuild Plugins/Memo/Memo.csproj /p:Configuration=Release /p:Platform=AnyCPU /p:BuildProjectReferences=false /nologo /v:minimal
          if ($LASTEXITCODE) { throw 'Memo build failed' }
      - name: Build and smoke-test both native architectures
        shell: powershell
        run: .\Italiano\scripts\Build-Native.ps1
      - name: Run stability regression
        shell: powershell
        run: .\Italiano\tests\Run-Regression.ps1
      - name: Run existing managed unit tests
        shell: powershell
        run: |
          dotnet restore QTTabBar.Tests/QTTabBar.Tests.csproj --source https://api.nuget.org/v3/index.json
          if ($LASTEXITCODE) { throw 'Test restore failed' }
          dotnet test QTTabBar.Tests/QTTabBar.Tests.csproj --configuration Release --no-restore /p:BuildProjectReferences=false --logger "console;verbosity=minimal"
          if ($LASTEXITCODE) { throw 'Managed unit tests failed' }
      - name: Guard retired serialization and parse scripts
        shell: powershell
        run: .\Italiano\scripts\Test-SecuritySource.ps1
      - name: Parse every Italian PowerShell script
        shell: powershell
        run: |
          Get-ChildItem Italiano -Recurse -Filter *.ps1 -File | ForEach-Object {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors)
            if ($errors.Count) { throw ($errors | Out-String) }
          }
      - name: Download pinned packaging inputs and build offline package
        shell: powershell
        run: |
          New-Item inputs -ItemType Directory -Force | Out-Null
          Invoke-WebRequest https://github.com/indiff/qttabbar/releases/download/v1.6.3/QTTabBar.Setup.1.6.3.exe -OutFile inputs/upstream.exe
          Invoke-WebRequest https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip -OutFile inputs/wix.zip
          if ((Get-FileHash inputs/wix.zip).Hash -ne '6AC824E1642D6F7277D0ED7EA09411A508F6116BA6FAE0AA5F2C7DAA2FF43D31') { throw 'WiX hash mismatch' }
          Expand-Archive inputs/wix.zip inputs/wix
          Invoke-WebRequest https://github.com/mattia-di-chiara-5/QTTabBar-Italiano-Windows10/releases/download/it-v0.6.0/QTTabBar-Italiano-Windows10-v0.6.0.zip -OutFile inputs/previous.zip
          if ((Get-FileHash inputs/previous.zip).Hash -ne 'AA3C71C3D471BEA2C511300425A7939D42D36DB96DEFA36B11F04D402EB477C3') { throw 'Previous release hash mismatch' }
          Expand-Archive inputs/previous.zip inputs/previous
          $rollback = Get-ChildItem inputs/previous -Recurse -Filter QTTabBar-Italiano-v0.6.0.msi | Select-Object -First 1
          .\Italiano\scripts\Build-StabilityPackage.ps1 -UpstreamInstaller "$pwd\inputs\upstream.exe" -WixDirectory "$pwd\inputs\wix" -RollbackMsi $rollback.FullName
          .\Italiano\tests\Test-OfflinePackage.ps1 -PackageDirectory "$pwd\Italiano\dist\QTTabBar-Italiano-v0.7.0"
      - uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6
        if: github.event_name != 'pull_request'
        with:
          subject-path: |
            QTTabBar/bin/Release/QTTabBar.dll
            Plugins/Memo/bin/Release/Memo.dll
            QTHookLib/bin/Release/QTHookLib32.dll
            QTHookLib/bin/Release/QTHookLib64.dll
            Italiano/dist/QTTabBar-Italiano-Windows10-v0.7.0.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: QTTabBar-Italiano-v0.7.0
          path: Italiano/dist/QTTabBar-Italiano-Windows10-v0.7.0.zip
